name: mailposture

services:
  mailposture:
    image: ${DOMAINPOSTURE_IMAGE:-${MAILPOSTURE_IMAGE:?Enter DOMAINPOSTURE_IMAGE, for example ghcr.io/owner/domainposture:latest}}
    pull_policy: always
    container_name: domainposture
    restart: unless-stopped
    depends_on:
      parsedmarc-opensearch:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      DOMAINPOSTURE_DEPLOYMENT_MODE: standalone
      DOMAINPOSTURE_SECRETS_KEY_FILE: /run/secrets/domainposture_secrets_key
      DOMAINPOSTURE_DISCORD_WEBHOOK: ${DOMAINPOSTURE_DISCORD_WEBHOOK:-${MAILPOSTURE_DISCORD_WEBHOOK:-}}
      OPENSEARCH_URL: http://parsedmarc-opensearch:9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-dmarc_aggregate*}
      OPENSEARCH_FAILURE_INDEX: ${OPENSEARCH_FAILURE_INDEX:-dmarc_failure*,dmarc_forensic*}
      OPENSEARCH_SMTP_TLS_INDEX: ${OPENSEARCH_SMTP_TLS_INDEX:-smtp_tls*}
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set the OpenSearch administrator password}
      OPENSEARCH_VERIFY_TLS: "false"
      SERVICE_LOGS_ENABLED: "true"
    secrets:
      - domainposture_secrets_key
    volumes:
      - type: bind
        source: ${DOMAINPOSTURE_SETTINGS_PATH:-${MAILPOSTURE_SETTINGS_PATH:-${ROOT:?Set ROOT to the parent directory for persistent application data}/mailposture/settings}}
        target: /data
      - type: volume
        source: parsedmarc_status
        target: /run/parsedmarc
        read_only: true
      - type: volume
        source: opensearch_logs
        target: /logs/opensearch
        read_only: true
    expose:
      - "8080"
    networks:
      backend:
        aliases: [domainposture, mailposture]
      proxy:
        aliases: [domainposture, mailposture]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  parsedmarc-opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2}
    container_name: parsedmarc-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: parsedmarc
      node.name: parsedmarc-opensearch
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set the OpenSearch administrator password}
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      bootstrap.memory_lock: "false"
      plugins.security.ssl.http.enabled: "false"
      path.repo: /usr/share/opensearch/snapshots
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - type: bind
        source: ${OPENSEARCH_DATA_PATH:-${ROOT}/mailposture/opensearch/data}
        target: /usr/share/opensearch/data
      - type: bind
        source: ${OPENSEARCH_SNAPSHOT_PATH:-${ROOT}/mailposture/opensearch/snapshots}
        target: /usr/share/opensearch/snapshots
      - type: volume
        source: opensearch_logs
        target: /usr/share/opensearch/logs
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '\"timed_out\":false'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  parsedmarc:
    image: ghcr.io/domainaware/parsedmarc:${PARSEDMARC_VERSION:-latest}
    container_name: parsedmarc
    restart: unless-stopped
    depends_on:
      parsedmarc-opensearch:
        condition: service_healthy
      mailposture:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        child=""
        log_tail=""
        log_file="/run/mailposture/parsedmarc.log"
        touch "$$log_file"
        chmod 644 "$$log_file"
        tail -n 0 -f "$$log_file" &
        log_tail="$$!"
        log_message() {
          printf '%s %s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$*" >> "$$log_file"
        }
        trim_log() {
          log_size="$$(wc -c < "$$log_file" 2>/dev/null || echo 0)"
          if [ "$$log_size" -gt 5242880 ]; then
            tail -c 2097152 "$$log_file" > "$$log_file.tmp" && cat "$$log_file.tmp" > "$$log_file"
            rm -f "$$log_file.tmp"
          fi
        }
        write_status() {
          status_state="$$1"
          status_exit="$${2:-null}"
          status_time="$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          status_checksum="$$(cksum < /etc/parsedmarc/config.ini 2>/dev/null | awk '{print $$1 ":" $$2}')"
          printf '{"state":"%s","updated_at":"%s","config_checksum":"%s","exit_code":%s}\n' \
            "$$status_state" "$$status_time" "$$status_checksum" "$$status_exit" \
            > /run/mailposture/status.json.tmp
          mv /run/mailposture/status.json.tmp /run/mailposture/status.json
          chmod 644 /run/mailposture/status.json
        }
        stop_child() {
          if [ -n "$$child" ]; then
            kill -TERM "$$child" 2>/dev/null || true
            wait "$$child" 2>/dev/null || true
          fi
          if [ -n "$$log_tail" ]; then
            kill -TERM "$$log_tail" 2>/dev/null || true
          fi
          write_status stopped 0
          exit 0
        }
        trap stop_child TERM INT
        while true; do
          while ! grep -q '^\[mailbox\]' /etc/parsedmarc/config.ini 2>/dev/null; do
            write_status waiting_config null
            log_message "Waiting for report mailbox settings to be enabled in DomainPosture"
            sleep 10
          done
          checksum="$$(cksum < /etc/parsedmarc/config.ini)"
          write_status starting null
          log_message "Starting parsedmarc"
          parsedmarc -c /etc/parsedmarc/config.ini >> "$$log_file" 2>&1 &
          child="$$!"
          write_status running null
          while kill -0 "$$child" 2>/dev/null; do
            sleep 10
            updated="$$(cksum < /etc/parsedmarc/config.ini 2>/dev/null || true)"
            if [ "$$updated" != "$$checksum" ]; then
              write_status reloading null
              log_message "DomainPosture settings changed; reloading parsedmarc"
              kill -TERM "$$child" 2>/dev/null || true
              wait "$$child" 2>/dev/null || true
              child=""
              break
            fi
            write_status running null
            trim_log
          done
          if [ -n "$$child" ]; then
            wait "$$child" 2>/dev/null
            exit_code="$$?"
            write_status error "$$exit_code"
            child=""
          fi
          sleep 2
        done
    environment:
      PARSEDMARC_OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    volumes:
      - type: bind
        source: ${DOMAINPOSTURE_SETTINGS_PATH:-${MAILPOSTURE_SETTINGS_PATH:-${ROOT}/mailposture/settings}}/parsedmarc
        target: /etc/parsedmarc
        read_only: true
      - type: volume
        source: parsedmarc_status
        target: /run/mailposture
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "test -s /etc/parsedmarc/config.ini && test -r /etc/parsedmarc/config.ini"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  parsedmarc_status:
    name: ${PARSEDMARC_STATUS_VOLUME:-mailposture_parsedmarc_status}
  opensearch_logs:
    name: ${OPENSEARCH_LOG_VOLUME:-mailposture_opensearch_logs}

secrets:
  domainposture_secrets_key:
    file: ${DOMAINPOSTURE_SECRETS_KEY_PATH:?Set DOMAINPOSTURE_SECRETS_KEY_PATH to a file containing a 32-byte base64 or hexadecimal key}

networks:
  backend:
    name: mailposture-backend
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

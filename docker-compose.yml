name: mailposture

services:
  mailposture:
    image: ${DOMAINPOSTURE_IMAGE:-${MAILPOSTURE_IMAGE:?Enter DOMAINPOSTURE_IMAGE, for example ghcr.io/owner/domainposture:latest}}
    pull_policy: always
    container_name: domainposture
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DOMAINPOSTURE_DEPLOYMENT_MODE: external
      DOMAINPOSTURE_SECRETS_KEY_FILE: /run/secrets/domainposture_secrets_key
      DOMAINPOSTURE_DISCORD_WEBHOOK: ${DOMAINPOSTURE_DISCORD_WEBHOOK:-${MAILPOSTURE_DISCORD_WEBHOOK:-}}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://parsedmarc-opensearch:9200}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-dmarc_aggregate*}
      OPENSEARCH_FAILURE_INDEX: ${OPENSEARCH_FAILURE_INDEX:-dmarc_failure*,dmarc_forensic*}
      OPENSEARCH_SMTP_TLS_INDEX: ${OPENSEARCH_SMTP_TLS_INDEX:-smtp_tls*}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-}
      OPENSEARCH_VERIFY_TLS: ${OPENSEARCH_VERIFY_TLS:-false}
      SERVICE_LOGS_ENABLED: ${SERVICE_LOGS_ENABLED:-false}
    secrets:
      - domainposture_secrets_key
    volumes:
      - mailposture_data:/data:rw
    expose:
      - "8080"
    networks:
      monitoring:
        aliases: [domainposture, mailposture]
      proxy:
        aliases: [domainposture, mailposture]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mailposture_data:
    name: ${DOMAINPOSTURE_DATA_VOLUME:-${MAILPOSTURE_DATA_VOLUME:-mailposture_data}}

secrets:
  domainposture_secrets_key:
    file: ${DOMAINPOSTURE_SECRETS_KEY_PATH:?Set DOMAINPOSTURE_SECRETS_KEY_PATH to a file containing a 32-byte base64 or hexadecimal key}

networks:
  monitoring:
    external: true
    name: ${MONITORING_NETWORK:-monitoring}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
